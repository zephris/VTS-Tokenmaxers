name: "Issue Autolink"
on:
  issues:
    types: [assigned]

permissions:
  contents: write

jobs:
  create-branch:
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest
    steps:
      - name: Debug event payload
        run: |
          echo "Event action: ${{ github.event.action }}"
          echo "Issue number: ${{ github.event.issue.number }}"
          echo "Issue title: ${{ github.event.issue.title }}"
          echo "Assignee: ${{ github.event.issue.assignee.login }}"

      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate branch name
        id: branch-name
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          TITLE=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g; s/--+/-/g')
          if [ -z "$TITLE" ]; then
            BRANCH_NAME="issue-${ISSUE_NUMBER}"
          else
            BRANCH_NAME="issue-${ISSUE_NUMBER}-${TITLE}"
          fi
          echo "name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create branch for issue
        env:
          BRANCH_NAME: ${{ steps.branch-name.outputs.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin

          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Branch $BRANCH_NAME already exists"
            echo "Branch already exists for issue ${{ github.event.issue.number }}"
            exit 0
          fi

          git checkout -b "$BRANCH_NAME"
          git push --set-upstream origin "$BRANCH_NAME"
          echo "Branch created successfully for issue ${{ github.event.issue.number }}: $BRANCH_NAME"