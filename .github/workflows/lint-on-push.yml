name: Lint on push

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check formatting (Prettier)
        run: npx --yes prettier@3.9.6 --check .

  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Lint Python (flake8)
        run: |
          pip install flake8
          flake8 .
